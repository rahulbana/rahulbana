</text><text class="terminal-2248283874-r4" x="0" y="605.6" textLength="36.6" clip-path="url(#terminal-2248283874-line-24)">&#160;•&#160;</text><text class="terminal-2248283874-r2" x="36.6" y="605.6" textLength="1305.4" clip-path="url(#terminal-2248283874-line-24)">Jul&#160;1–3,&#160;2026&#160;—&#160;Khan&#160;unveiled&#160;the&#160;Knight&#160;Riders&#160;Cricket&#160;Ground&#160;at&#160;Fairplex,&#160;Pomona&#160;(Los&#160;Angeles&#160;area);&#160;the&#160;</text><text class="terminal-2248283874-r2" x="1342" y="605.6" textLength="12.2" clip-path="url(#terminal-2248283874-line-24)">
</text><text class="terminal-2248283874-r2" x="36.6" y="630" textLength="1305.4" clip-path="url(#terminal-2248283874-line-25)">venue&#160;hosted&#160;its&#160;first&#160;Major&#160;League&#160;Cricket&#160;game&#160;amid&#160;LA28&#160;Olympic‑cricket&#160;build‑up&#160;(India&#160;Today;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="630" textLength="12.2" clip-path="url(#terminal-2248283874-line-25)">
</text><text class="terminal-2248283874-r2" x="36.6" y="654.4" textLength="1305.4" clip-path="url(#terminal-2248283874-line-26)">Associated&#160;Press).&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="654.4" textLength="12.2" clip-path="url(#terminal-2248283874-line-26)">
