    <text class="terminal-2248283874-r1" x="0" y="20" textLength="414.8" clip-path="url(#terminal-2248283874-line-0)">#&#160;Celebrity&#160;Radar&#160;—&#160;Shah&#160;Rukh&#160;Khan</text><text class="terminal-2248283874-r2" x="1342" y="20" textLength="12.2" clip-path="url(#terminal-2248283874-line-0)">
</text><text class="terminal-2248283874-r2" x="1342" y="44.4" textLength="12.2" clip-path="url(#terminal-2248283874-line-1)">
</text><text class="terminal-2248283874-r3" x="0" y="68.8" textLength="85.4" clip-path="url(#terminal-2248283874-line-2)">Summary</text><text class="terminal-2248283874-r2" x="1342" y="68.8" textLength="12.2" clip-path="url(#terminal-2248283874-line-2)">
</text><text class="terminal-2248283874-r2" x="1342" y="93.2" textLength="12.2" clip-path="url(#terminal-2248283874-line-3)">
</text><text class="terminal-2248283874-r2" x="0" y="117.6" textLength="1342" clip-path="url(#terminal-2248283874-line-4)">Shah&#160;Rukh&#160;Khan’s&#160;focus&#160;remains&#160;on&#160;King,&#160;which&#160;he&#160;says&#160;is&#160;on&#160;track&#160;for&#160;a&#160;December&#160;24,&#160;2026&#160;theatrical&#160;release&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="117.6" textLength="12.2" clip-path="url(#terminal-2248283874-line-4)">
</text><text class="terminal-2248283874-r2" x="0" y="142" textLength="1342" clip-path="url(#terminal-2248283874-line-5)">despite&#160;earlier&#160;filming&#160;pauses&#160;from&#160;a&#160;shoulder&#160;injury&#160;and&#160;ongoing&#160;VFX&#160;work.&#160;He&#160;secured&#160;legal&#160;relief&#160;to&#160;proceed</text><text class="terminal-2248283874-r2" x="1342" y="142" textLength="12.2" clip-path="url(#terminal-2248283874-line-5)">
</text><text class="terminal-2248283874-r2" x="0" y="166.4" textLength="1342" clip-path="url(#terminal-2248283874-line-6)">with&#160;renovations&#160;to&#160;his&#160;Mumbai&#160;home,&#160;Mannat,&#160;while&#160;separately&#160;facing&#160;regulatory&#160;scrutiny&#160;over&#160;a&#160;Vimal&#160;Elaichi&#160;</text><text class="terminal-2248283874-r2" x="1342" y="166.4" textLength="12.2" clip-path="url(#terminal-2248283874-line-6)">
</text><text class="terminal-2248283874-r2" x="0" y="190.8" textLength="1342" clip-path="url(#terminal-2248283874-line-7)">advertisement.&#160;He&#160;continues&#160;to&#160;be&#160;a&#160;high‑profile&#160;target&#160;of&#160;AI&#160;deepfakes&#160;and&#160;scam&#160;endorsements,&#160;with&#160;multiple&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="190.8" textLength="12.2" clip-path="url(#terminal-2248283874-line-7)">
</text><text class="terminal-2248283874-r2" x="0" y="215.2" textLength="1342" clip-path="url(#terminal-2248283874-line-8)">fact‑checks&#160;debunking&#160;viral&#160;clips.&#160;Fan&#160;engagement&#160;stays&#160;high&#160;via&#160;#AskSRK&#160;sessions&#160;and&#160;sustained&#160;online&#160;chatter</text><text class="terminal-2248283874-r2" x="1342" y="215.2" textLength="12.2" clip-path="url(#terminal-2248283874-line-8)">
</text><text class="terminal-2248283874-r2" x="0" y="239.6" textLength="1342" clip-path="url(#terminal-2248283874-line-9)">around&#160;King.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="239.6" textLength="12.2" clip-path="url(#terminal-2248283874-line-9)">
</text><text class="terminal-2248283874-r2" x="1342" y="264" textLength="12.2" clip-path="url(#terminal-2248283874-line-10)">
</text><text class="terminal-2248283874-r3" x="0" y="288.4" textLength="134.2" clip-path="url(#terminal-2248283874-line-11)">Recent&#160;News</text><text class="terminal-2248283874-r2" x="1342" y="288.4" textLength="12.2" clip-path="url(#terminal-2248283874-line-11)">
</text><text class="terminal-2248283874-r2" x="1342" y="312.8" textLength="12.2" clip-path="url(#terminal-2248283874-line-12)">
</text><text class="terminal-2248283874-r4" x="0" y="337.2" textLength="36.6" clip-path="url(#terminal-2248283874-line-13)">&#160;•&#160;</text><text class="terminal-2248283874-r2" x="36.6" y="337.2" textLength="1305.4" clip-path="url(#terminal-2248283874-line-13)">Sep&#160;15,&#160;2026&#160;—&#160;In&#160;an&#160;#AskSRK&#160;session,&#160;Khan&#160;reaffirmed&#160;King’s&#160;Dec&#160;24,&#160;2026&#160;release&#160;window,&#160;citing&#160;earlier&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="337.2" textLength="12.2" clip-path="url(#terminal-2248283874-line-13)">
</text><text class="terminal-2248283874-r2" x="36.6" y="361.6" textLength="1305.4" clip-path="url(#terminal-2248283874-line-14)">stoppages&#160;due&#160;to&#160;a&#160;shoulder&#160;injury&#160;and&#160;a&#160;current&#160;VFX&#160;crunch;&#160;he&#160;teased&#160;Arijit&#160;Singh’s&#160;“finishing&#160;touches”&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="361.6" textLength="12.2" clip-path="url(#terminal-2248283874-line-14)">
</text><text class="terminal-2248283874-r2" x="36.6" y="386" textLength="1305.4" clip-path="url(#terminal-2248283874-line-15)">on&#160;the&#160;first&#160;song&#160;(Variety&#160;India;&#160;India&#160;Today).&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="386" textLength="12.2" clip-path="url(#terminal-2248283874-line-15)">
</text><text class="terminal-2248283874-r4" x="0" y="410.4" textLength="36.6" clip-path="url(#terminal-2248283874-line-16)">&#160;•&#160;</text><text class="terminal-2248283874-r2" x="36.6" y="410.4" textLength="1305.4" clip-path="url(#terminal-2248283874-line-16)">Ongoing&#160;—&#160;Red&#160;Chillies&#160;Entertainment’s&#160;official&#160;film&#160;page&#160;lists&#160;King&#160;for&#160;Dec&#160;24,&#160;2026,&#160;starring&#160;Shah&#160;Rukh&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="410.4" textLength="12.2" clip-path="url(#terminal-2248283874-line-16)">
</text><text class="terminal-2248283874-r2" x="36.6" y="434.8" textLength="1305.4" clip-path="url(#terminal-2248283874-line-17)">Khan&#160;and&#160;directed&#160;by&#160;Siddharth&#160;Anand&#160;(Red&#160;Chillies).&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="434.8" textLength="12.2" clip-path="url(#terminal-2248283874-line-17)">
</text><text class="terminal-2248283874-r4" x="0" y="459.2" textLength="36.6" clip-path="url(#terminal-2248283874-line-18)">&#160;•&#160;</text><text class="terminal-2248283874-r2" x="36.6" y="459.2" textLength="1305.4" clip-path="url(#terminal-2248283874-line-18)">Aug&#160;16–18,&#160;2026&#160;—&#160;Maharashtra&#160;FDA&#160;issued&#160;show‑cause&#160;notices&#160;to&#160;Khan&#160;(and&#160;others)&#160;over&#160;a&#160;Vimal&#160;Elaichi&#160;ad&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="459.2" textLength="12.2" clip-path="url(#terminal-2248283874-line-18)">
</text><text class="terminal-2248283874-r2" x="36.6" y="483.6" textLength="1305.4" clip-path="url(#terminal-2248283874-line-19)">for&#160;alleged&#160;surrogate&#160;promotion&#160;of&#160;a&#160;prohibited&#160;pan&#160;masala&#160;brand;&#160;actors&#160;were&#160;asked&#160;to&#160;remove&#160;related&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="483.6" textLength="12.2" clip-path="url(#terminal-2248283874-line-19)">
</text><text class="terminal-2248283874-r2" x="36.6" y="508" textLength="1305.4" clip-path="url(#terminal-2248283874-line-20)">promotions&#160;and&#160;respond.&#160;Aug&#160;17&#160;follow‑up:&#160;the&#160;FDA&#160;commissioner&#160;said&#160;the&#160;actors&#160;have&#160;responded;&#160;two&#160;hearings</text><text class="terminal-2248283874-r2" x="1342" y="508" textLength="12.2" clip-path="url(#terminal-2248283874-line-20)">
</text><text class="terminal-2248283874-r2" x="36.6" y="532.4" textLength="1305.4" clip-path="url(#terminal-2248283874-line-21)">held&#160;(Indian&#160;Express;&#160;Moneycontrol;&#160;PTI;&#160;Bollywood&#160;Hungama;&#160;Times&#160;of&#160;India).&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-2248283874-r2" x="1342" y="532.4" textLength="12.2" clip-path="url(#terminal-2248283874-line-21)">
</text><text class="terminal-2248283874-r4" x="0" y="556.8" textLength="36.6" clip-path="url(#terminal-2248283874-line-22)">&#160;•&#160;</text><text class="terminal-2248283874-r2" x="36.6" y="556.8" textLength="1305.4" clip-path="url(#terminal-2248283874-line-22)">Jul&#160;14–15,&#160;2026&#160;—&#160;India’s&#160;Supreme&#160;Court&#160;dismissed&#160;a&#160;plea&#160;challenging&#160;CRZ&#160;clearance&#160;for&#160;adding&#160;two&#160;floors&#160;to</text><text class="terminal-2248283874-r2" x="1342" y="556.8" textLength="12.2" clip-path="url(#terminal-2248283874-line-22)">
